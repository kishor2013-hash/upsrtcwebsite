<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="100" fill="url(#blueGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.8" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="206" fill="#1e3a8a" stroke="#ffffff" stroke-width="2" opacity="0.3" />

  <!-- Road / Pathway -->
  <path d="M190 380 L230 280 L282 280 L322 380 Z" fill="#334155" opacity="0.7"/>
  <line x1="256" y1="285" x2="256" y2="375" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8" />

  <!-- Bus Silhouette -->
  <g filter="url(#glow)" transform="translate(136, 130)">
    <!-- Bus Body -->
    <rect x="20" y="30" width="200" height="170" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    <!-- Bus Roof Destination Board -->
    <rect x="50" y="44" width="140" height="24" rx="6" fill="#1e293b" />
    <text x="120" y="60" fill="#f59e0b" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="2">UPSRCTC</text>
    
    <!-- Windshield -->
    <rect x="36" y="78" width="168" height="54" rx="10" fill="#0284c7" opacity="0.85" />
    <path d="M42 84 L114 84 L114 126 L42 126 Z" fill="#38bdf8" opacity="0.4" />
    <path d="M126 84 L198 84 L198 126 L126 126 Z" fill="#38bdf8" opacity="0.4" />
    <line x1="120" y1="78" x2="120" y2="132" stroke="#ffffff" stroke-width="3" />
    
    <!-- Grille & Headlights -->
    <rect x="65" y="148" width="110" height="28" rx="6" fill="#1e3a8a" />
    <line x1="75" y1="156" x2="165" y2="156" stroke="#f59e0b" stroke-width="2" />
    <line x1="75" y1="162" x2="165" y2="162" stroke="#ffffff" stroke-width="1.5" />
    <line x1="75" y1="168" x2="165" y2="168" stroke="#f59e0b" stroke-width="2" />

    <!-- Left Headlight -->
    <circle cx="44" cy="162" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
    <!-- Right Headlight -->
    <circle cx="196" cy="162" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />

    <!-- Bumper -->
    <rect x="25" y="186" width="190" height="14" rx="5" fill="#0f172a" />

    <!-- Wheels -->
    <rect x="34" y="196" width="30" height="12" rx="4" fill="#020617" />
    <rect x="176" y="196" width="30" height="12" rx="4" fill="#020617" />
  </g>

  <!-- Circular Title Text (Upper Arc & Lower Arc) -->
  <text x="256" y="96" fill="#fbbf24" font-size="22" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="4">
    UPSRCTC ROADWAYS
  </text>
  <text x="256" y="420" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="3">
    DIGITAL DUTY PORTAL
  </text>
  <text x="256" y="445" fill="#f59e0b" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="2">
    VERSION 4.0
  </text>
</svg>
